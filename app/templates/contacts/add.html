{% extends "base.html" %}

{% block title %}Enter a New Contact{% endblock %}

{% block content %}
<form method="post">
    <label>Name</label>
    <input type="text" name="name">
    <label>Organization</label>
    <select name="org_name">
        {% for org in org_info %}
        <option value="{{ org['name'] }}">{{ org['name'] }}</option>
        {% endfor %}
        <option value="other">Other</option>
    </select>
    <label>If other, enter org name</label>
    <input type="text" name="other_org_name" id="other_org_name">
    <label>Platform</label>
    <input type="text" name="platform">
    <label>Value</label>
    <input type="text" name="contact_value">
    <label>Capacity</label>
    <input type="text" name="capacity">
    <label>Follow Up On</label>
    <input type="date" name="next_follow_up_date">
    <label>Notes</label>
    <input type="text" name="notes">
    <button type="submit">Save</button>
</form>
{% endblock %}
