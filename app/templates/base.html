<!-- Base template inherited by all pages. Defines nav, flash messages, and content block. -->
<!DOCTYPE html>
<html lang="en">

<head>
    <title>
        {% block title %} Job Campaign Tracker {% endblock %}
    </title>
</head>

<body>
    <nav>
        <a href="{{ url_for('dashboard.index') }}">Dashboard</a> | <a
            href="{{ url_for('applications.list_applications') }}">Applications</a> | <a
            href="{{ url_for('contacts.list_contacts') }}">Contacts</a> | <a
            href="{{ url_for('orgs.list_orgs') }}">Organizations</a>
    </nav>

    {% with messages = get_flashed_messages() %}
    {% if messages %}
    {% for message in messages %}
    <p>{{ message }}</p>
    {% endfor %}
    {% endif %}
    {% endwith %}

    {% block content%} {% endblock %}
</body>

</html>
