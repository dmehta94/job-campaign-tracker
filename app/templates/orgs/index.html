<!-- Template displaying the full list of organizations. -->
 {% extends "base.html" %}

{% block title %}Organizations{% endblock %}

{% block content %}
<table>
    <thead>
        <tr>
            <th>Name</th>
            <th>Careers Page</th>
            <th>Category</th>
        </tr>
    </thead>
    <tbody>
        {% for org in orgs %}
        <tr>
            <td><a href="{{ url_for('orgs.org_detail', id = org.id) }}">{{ org.name }}</a></td>
            <td>{{ org.careers_url }}</td>
            <td>{{ org.category }}</td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
